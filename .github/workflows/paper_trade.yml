name: Paper Trading Loop

# Runs a single long-lived job that loops internally for ~5h50m (checking
# every 5 minutes and checkpointing to git every 30), then exits cleanly
# just under GitHub Actions' hard 6-hour job limit.
#
# Continuity is driven by SELF-DISPATCH, not cron: paper_trader/run.py calls
# the GitHub API near the end of its run to trigger the next run directly.
# This was added after an observed ~4.5h gap when relying on cron alone --
# GitHub's schedule triggers on low-activity repos can be delayed by hours.
# The cron below is kept only as a once-a-day safety net in case a run ever
# crashes before reaching its self-dispatch call. See paper_trader/run.py.

on:
  schedule:
    - cron: "5 0 * * *"     # once-daily fallback only, in case self-dispatch ever fails
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # required for the in-loop self-dispatch API call

concurrency:
  group: paper-trading-loop
  cancel-in-progress: false

jobs:
  paper_trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # 5h55m, safely under the 6h hard limit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Configure git for in-loop checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run paper trading loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u paper_trader/run.py
