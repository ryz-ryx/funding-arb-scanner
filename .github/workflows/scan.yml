name: Funding Rate Scan

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # allow manual "Run workflow" button too

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scanner, append log, write dashboard JSON
        run: |
          python scanner/live_scanner.py docs/data/latest_scan.json >> SCAN_LOG.md
          echo "" >> SCAN_LOG.md
          echo "---" >> SCAN_LOG.md
          echo "" >> SCAN_LOG.md

      - name: Commit updated log and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SCAN_LOG.md docs/data/latest_scan.json
          git diff --staged --quiet || git commit -m "Scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
